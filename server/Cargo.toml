[package]
name = "twinpad-server"
description = "Servidor PC: gestiona sesiones, expone el QR de vinculación y coordina los streams (REQ-001, REQ-002)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
twinpad-core = { path = "../core" }
getrandom = "0.3"
# Render del QR de vinculación en terminal (ENG §11: MIT/Apache, sin unsafe,
# sin deps transitivas, mantenido por Nayuki)
qrcodegen = "1.8"

[[bin]]
name = "twinpad-server"
path = "src/main.rs"

[lints]
workspace = true

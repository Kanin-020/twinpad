[package]
name = "twinpad-server"
description = "Servidor PC: gestiona sesiones, expone el QR de vinculación y coordina los streams (REQ-001, REQ-002)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
twinpad-core = { path = "../core" }
twinpad-capture = { path = "capture" }
getrandom = "0.3"
base64 = "0.22"
# Render del QR de vinculación en terminal (ENG §11: MIT/Apache, sin unsafe,
# sin deps transitivas, mantenido por Nayuki)
qrcodegen = "1.8"

[dev-dependencies]
# Los tests de integración simulan al juego con SDK (AC-2) contra el
# listener IPC real en loopback (test-strategy §10: el protocolo no se
# mockea); solo alcanza al crate de tests, no al binario (ARCH §3).
twinpad-sdk = { path = "../sdk" }

[[bin]]
name = "twinpad-server"
path = "src/main.rs"

[lints]
workspace = true

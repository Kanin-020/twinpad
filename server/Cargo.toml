[package]
name = "twinpad-server"
description = "Servidor PC: gestiona sesiones, expone el QR de vinculación y coordina los streams (REQ-001, REQ-002)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
twinpad-core = { path = "../core" }
twinpad-capture = { path = "capture" }
getrandom = "0.3"
# SO_SNDBUF/TCP_NODELAY del socket de sesión (anti-lag @60fps, 2026-10-10):
# libc ya era transitiva (zbus); se declara explícita por uso directo.
libc = "0.2"
base64 = "0.22"
serde_json = "1"
# Encode JPEG del stream (CR-001): revisión ENG §11 — rust-image org,
# MIT/Apache, mantenido, sin unsafe directo; solo la feature jpeg.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Encoder JPEG baseline con ruta SIMD AVX2 detectada en runtime para sostener
# la codificación por frame sin cambiar el wire JPEG (CR-001 / SPEC-003).
jpeg-encoder = { version = "0.6.1", features = ["simd"] }
# Render del QR de vinculación en terminal (ENG §11: MIT/Apache, sin unsafe,
# sin deps transitivas, mantenido por Nayuki)
qrcodegen = "1.8"
socket2 = "0.6"

[dev-dependencies]
# Los tests de integración simulan al juego con SDK (AC-2) contra el
# listener IPC real en loopback (test-strategy §10: el protocolo no se
# mockea); solo alcanza al crate de tests, no al binario (ARCH §3).
twinpad-sdk = { path = "../sdk" }

[[bin]]
name = "twinpad-server"
path = "src/main.rs"

[lints]
workspace = true

[package]
name = "twinpad-core"
description = "Twinpad Core: protocolo de sesión y tipos de dominio compartidos (sin I/O)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Revisión ENG §11: mantenidos, sin unsafe, MIT/Apache (DES-001 §11)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
digest = "0.10"
aes-gcm = "0.10"
base64 = "0.22"


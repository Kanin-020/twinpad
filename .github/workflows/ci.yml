name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust gates (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libpipewire-0.3-dev libgbm-dev libdrm-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  android:
    name: Android gates (ktlint, detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: ktlint + detekt
        run: ./gradlew ktlintCheck detekt
        working-directory: android
      - name: unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: android

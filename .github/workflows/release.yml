name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.2.3 or v1.2.3)
        required: true
        type: string
      prerelease:
        description: Mark this release as a pre-release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-22.04
    steps:
      - name: Validate manual release version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi

  android:
    name: Build Android APK
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android API and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Name APK
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: cp android/app/build/outputs/apk/release/app-release.apk "twinpad-android-${RELEASE_VERSION#v}-debug-signed.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: twinpad-android
          path: twinpad-android-*.apk
          if-no-files-found: error

  server:
    name: Build Twinpad server AppImage (Linux x86_64)
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libpipewire-0.3-dev libgbm-dev libdrm-dev libegl1-mesa-dev pkg-config patchelf desktop-file-utils
      - name: Build server
        run: cargo build --locked --release -p twinpad-server
      - name: Package server as AppImage
        env:
          APPIMAGE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/scalable/apps dist
          install -m 0755 target/release/twinpad-server AppDir/usr/bin/twinpad-server
          cat > AppDir/twinpad-server.desktop <<'EOF'
          [Desktop Entry]
          Name=Twinpad Server
          Type=Application
          Terminal=true
          Exec=twinpad-server
          Icon=twinpad-server
          Categories=Utility;
          EOF
          cat > AppDir/usr/share/icons/hicolor/scalable/apps/twinpad-server.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254">
            <rect width="1254" height="1254" rx="276" fill="#FFFFFF"/>
            <g fill="#7064F2" transform="translate(0 28) translate(627 599) scale(0.6) translate(-627 -599)">
              <path d="M530,340C565,328 601,352 601,392L601,815C601,850 575,870 540,864L312,778C285,768 271,745 271,720L271,478C271,450 288,428 312,420Z"/>
              <path d="M724,340C689,328 653,352 653,392L653,815C653,850 679,870 714,864L942,778C969,768 983,745 983,720L983,478C983,450 966,428 942,420Z"/>
            </g>
          </svg>
          EOF
          chmod +x AppDir/twinpad-server.desktop
          desktop-file-validate AppDir/twinpad-server.desktop

          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output linuxdeploy.AppImage
          curl --fail --location --retry 3 \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output appimagetool.AppImage
          chmod +x linuxdeploy.AppImage appimagetool.AppImage

          ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/twinpad-server \
            --desktop-file AppDir/twinpad-server.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/twinpad-server.svg
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run \
            AppDir "dist/twinpad-server-${APPIMAGE_VERSION}-x86_64.AppImage"
          chmod +x "dist/twinpad-server-${APPIMAGE_VERSION}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: twinpad-server-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  decky:
    name: Build Decky plugin (Twinpad)
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build plugin
        working-directory: integrations/decky-twinpad
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Package plugin as zip
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          plugin=integrations/decky-twinpad
          stage=dist/decky/Twinpad
          mkdir -p "$stage/dist"
          cp "$plugin/plugin.json" "$plugin/package.json" "$plugin/main.py" "$plugin/LICENSE" "$plugin/README.md" "$stage/"
          cp -a "$plugin/assets" "$plugin/defaults" "$plugin/py_modules" "$stage/"
          cp "$plugin/dist/index.js" "$stage/dist/"
          (cd dist/decky && zip -qr "../decky-twinpad-${RELEASE_TAG#v}.zip" Twinpad)
      - uses: actions/upload-artifact@v4
        with:
          name: decky-twinpad
          path: dist/decky-twinpad-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [validate, android, server, decky]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true
      - name: Create release and attach build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$RELEASE_TAG"
            release_tag="${release_tag#v}"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$release_tag" != v* ]]; then
            release_tag="v${release_tag}"
          fi

          notes_file="$RUNNER_TEMP/twinpad-release-notes.md"
          cp .github/release-notes.md "$notes_file"
          if changelog=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$release_tag" \
              -f target_commitish="$GITHUB_SHA" \
              --jq .body 2>/dev/null); then
            {
              printf '\n---\n\n## Cambios de esta versión\n\n'
              printf '%s\n' "$changelog"
            } >> "$notes_file"
          fi

          gh_args=(release create "$release_tag" release-assets/*
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "Twinpad ${release_tag}"
            --notes-file "$notes_file")
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$RELEASE_PRERELEASE" == "true" ]]; then
            gh_args+=(--prerelease)
          fi
          gh "${gh_args[@]}"
